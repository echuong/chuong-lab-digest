# Literature Review Agent Configuration
# Edit this file to customize search parameters, journals, and keywords.

# Default time range in days
days_back: 30

# Size of the curated slate in the digest. This is the real, final count --
# it used to be multiplied by 2 internally, so "10" produced 20 papers.
top_n_papers: 20
top_n_preprints: 10

# Journal-breadth pass: after the global ranking, take up to this many papers
# per journal scoring at least journal_highlight_min_score, so a strong issue in
# a small journal is not crowded out by a prolific one.
top_per_journal: 3
journal_highlight_min_score: 5.0

# Minimum keyword score to include in digest
keyword_score_threshold: 3.0

# Output directory for digest reports
output_dir: "reports"

# Journals to track (name + RSS URL + PubMed title abbreviation for fallback)
journals:
  - name: "Nature"
    rss_url: "https://www.nature.com/nature.rss"
    pubmed_ta: "Nature"
  - name: "Cell"
    rss_url: "https://www.cell.com/cell/inpress.rss"
    pubmed_ta: "Cell"
  - name: "Science"
    rss_url: "https://www.science.org/action/showFeed?type=etoc&feed=rss&jc=science"
    pubmed_ta: "Science"
  - name: "eLife"
    rss_url: "https://elifesciences.org/rss/recent.xml"
    pubmed_ta: "Elife"
  - name: "Genome Research"
    rss_url: "https://genome.cshlp.org/rss/current.xml"
    pubmed_ta: "Genome Res"
  - name: "Immunity"
    rss_url: "https://www.cell.com/immunity/inpress.rss"
    pubmed_ta: "Immunity"
  - name: "Nature Immunology"
    rss_url: "https://www.nature.com/ni.rss"
    pubmed_ta: "Nat Immunol"
  - name: "Nature Medicine"
    rss_url: "https://www.nature.com/nm.rss"
    pubmed_ta: "Nat Med"
  - name: "Nature Genetics"
    rss_url: "https://www.nature.com/ng.rss"
    pubmed_ta: "Nat Genet"
  - name: "Nature Biotechnology"
    rss_url: "https://www.nature.com/nbt.rss"
    pubmed_ta: "Nat Biotechnol"
  - name: "Nature Methods"
    rss_url: "https://www.nature.com/nmeth.rss"
    pubmed_ta: "Nat Methods"
  - name: "Molecular Cell"
    rss_url: "https://www.cell.com/molecular-cell/inpress.rss"
    pubmed_ta: "Mol Cell"
  - name: "Cell Reports"
    rss_url: "https://www.cell.com/cell-reports/inpress.rss"
    pubmed_ta: "Cell Rep"
  - name: "Nature Communications"
    rss_url: "https://www.nature.com/ncomms.rss"
    pubmed_ta: "Nat Commun"
  - name: "Nature Reviews Genetics"
    rss_url: "https://www.nature.com/nrg.rss"
    pubmed_ta: "Nat Rev Genet"
  - name: "Science Advances"
    rss_url: "https://www.science.org/action/showFeed?type=etoc&feed=rss&jc=sciadv"
    pubmed_ta: "Sci Adv"
  - name: "Molecular Biology and Evolution"
    rss_url: "https://academic.oup.com/rss/site_5168/3591.xml"
    pubmed_ta: "Mol Biol Evol"
  - name: "Genome Biology"
    rss_url: "https://link.springer.com/search.rss?query=*&facet-journal-id=13059&search-within=Journal"
    pubmed_ta: "Genome Biol"
  - name: "PNAS"
    rss_url: "https://www.pnas.org/action/showFeed?type=etoc&feed=rss&jc=pnas"
    pubmed_ta: "Proc Natl Acad Sci U S A"
  - name: "Current Biology"
    rss_url: "https://www.cell.com/current-biology/inpress.rss"
    pubmed_ta: "Curr Biol"

# bioRxiv categories to search
# Ceiling on bioRxiv records walked per run. The API has no server-side category
# filter, so reaching every genetics/genomics/immunology preprint means paging the
# whole date range and filtering client-side — about 3,200 records for a 15-day
# window, at 30 per page. This costs wall-clock time only (roughly 7 minutes), not
# tokens: the preprint corpus is scored in memory and never written to the digest
# JSON. Lowering it truncates in bioRxiv's own order, which biases coverage toward
# one end of the window rather than just returning fewer papers.
biorxiv_max_scan: 8000

# Wall-clock ceiling for the bioRxiv scan, in seconds. The API's latency varies
# by more than 10x: the same 2,793-record fortnight took 531s on a good day and
# 6,135s on a flaky one. A partial scan is reported honestly (see
# stats.preprint_scan_truncated), so bounding the time is safe.
biorxiv_max_seconds: 1500

biorxiv_categories:
  - "genetics"
  - "genomics"
  - "immunology"
  - "molecular_biology"
  - "cell_biology"
  - "bioinformatics"
  - "evolutionary_biology"

# Journal quality blocklist (reject papers from these publishers/journals)
# Matched whole-word, and only against journals that are NOT in the tracked
# list above (and never against preprints). "Biology" here targets MDPI's
# journal *Biology*; as a bare substring it also matched Genome Biology,
# Current Biology, and Molecular Biology and Evolution, and silently removed
# all three tracked journals from the ranked corpus.
journal_blocklist:
  - "Frontiers"
  - "MDPI"
  - "Viruses"
  - "Cells"
  - "Genes"
  - "International Journal of Molecular Sciences"
  # PubMed reports journals by abbreviation, so block those forms too
  - "Int J Mol Sci"
  - "Biology"
  - "Biomolecules"
  - "Biomedicines"

# Keyword tiers for relevance scoring
# Each tier has a weight and a list of terms (case-insensitive)
# Title hits are multiplied by title_multiplier
keyword_tiers:
  tier1_core:
    weight: 10
    title_multiplier: 3
    terms:
      - "transposable element"
      - "transposon"
      - "endogenous retrovirus"
      - "ERV"
      - "HERV"
      - "SINE"
      - "LINE-1"
      - "LINE1"
      - "Alu element"
      - "LTR element"
      - "LTR retrotransposon"
      - "IFNAR2"
      - "LTR10"
      - "MER41"
      - "TE exonization"
      - "retrotransposon"
      - "repeat element"
      - "transposable"
      - "solo LTR"
      - "LTR18"
      - "LTR10"
      - "TE-derived enhancer"
      - "TE co-option"
